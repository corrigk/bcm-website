<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery — Boiler Catholic Men</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header id="site-header"></header>

<section class="section--tight" style="background:var(--blueprint); color:var(--parchment);">
  <div class="container">
    <div class="eyebrow" style="color:var(--gold-bright);">GALLERY</div>
    <h1 style="color:#fff;">Photo Gallery</h1>
    <p style="color:var(--gold); max-width:56ch;">
      Retreats, service events, and life together — click any photo for the full size.
    </p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="gallery-grid" class="gallery-grid">
      <p class="muted">Loading…</p>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/sample-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const grid = document.getElementById('gallery-grid');
    try{
      const photos = await BCMData.getGalleryPhotos();
      grid.innerHTML = photos.length ? photos.map(p => `
        <figure>
          <a href="${p.image_url}" target="_blank" rel="noopener">
            <img src="${p.image_url}" alt="${bcmEscape(p.caption || '')}" loading="lazy">
          </a>
          ${p.caption ? `<figcaption class="muted">${bcmEscape(p.caption)}</figcaption>` : ''}
        </figure>
      `).join('') : '<p class="muted">No photos yet — check back soon.</p>';
    }catch(e){
      console.error(e);
      grid.innerHTML = '<p class="muted">Couldn\'t load the gallery right now.</p>';
    }
  });
</script>
</body>
</html>
