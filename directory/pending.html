<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Pending — Boiler Catholic Men</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
</head>
<body>

<header id="site-header"></header>

<section class="section--tight" style="background:var(--blueprint); color:var(--parchment);">
  <div class="container">
    <div class="eyebrow" style="color:var(--gold-bright);">MEMBERS ONLY</div>
    <h1 style="color:#fff;">Request Pending</h1>
    <p style="color:var(--gold); max-width:56ch;">
      An admin needs to approve your access before you can browse the directory.
      In the meantime, go ahead and fill out your profile below — it'll be ready
      to go the moment you're approved.
    </p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:640px;">
    <div id="status-banner" class="panel" style="margin-bottom:24px;"></div>
    <div id="profile-editor"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="../js/config.js"></script>
<script src="../js/sample-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/purdue-majors.js"></script>
<script src="profile-form.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!BCMData.isLive()){
      document.getElementById('status-banner').innerHTML = "<p class='muted'>Supabase isn't connected yet — see README.md.</p>";
      return;
    }
    const session = await BCMData.getSession();
    if (!session){ location.href = 'login.html'; return; }
    const status = await BCMData.getMyStatus(session.user.id);
    if (status && status.approved){ location.href = 'browse.html'; return; }

    document.getElementById('status-banner').innerHTML = `
      <span class="tag">Pending</span>
      <p style="margin:10px 0 0;">Signed in as <strong>${bcmEscape(session.user.email)}</strong>.
      Requested ${status ? bcmFormatDate(status.requested_at) : 'recently'}.</p>
    `;

    renderProfileForm(document.getElementById('profile-editor'), session.user.id);
  });
</script>
</body>
</html>
