<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Directory — Boiler Catholic Men</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<section class="section--dark" style="min-height:100vh; display:flex; align-items:center;">
  <div class="container" style="max-width: 440px;">
    <div class="eyebrow" style="color:var(--gold-bright);">MEMBERS ONLY</div>
    <h1 style="color:#fff; font-size:1.8rem;">Join the Directory</h1>
    <p style="color:var(--gold); margin-bottom:20px;">
      For current BCM members and alumni. An admin approves every request
      before it's visible — this isn't public.
    </p>

    <div class="panel--dark panel">
      <form id="signup-form" class="stack">
        <label class="stack" style="gap:6px;">
          <span class="eyebrow" style="color:var(--gold); margin-bottom:0;">Full Name</span>
          <input type="text" id="name" required autocomplete="name"
            style="padding:10px; border:1px solid var(--line); background:var(--blueprint); color:#fff;">
        </label>
        <label class="stack" style="gap:6px;">
          <span class="eyebrow" style="color:var(--gold); margin-bottom:0;">Email</span>
          <input type="email" id="email" required autocomplete="username"
            style="padding:10px; border:1px solid var(--line); background:var(--blueprint); color:#fff;">
        </label>
        <label class="stack" style="gap:6px;">
          <span class="eyebrow" style="color:var(--gold); margin-bottom:0;">Password</span>
          <input type="password" id="password" required minlength="6" autocomplete="new-password"
            style="padding:10px; border:1px solid var(--line); background:var(--blueprint); color:#fff;">
        </label>
        <button type="submit" class="btn" style="width:100%; justify-content:center;">Request Access</button>
        <p id="signup-error" class="muted" style="color:#e2a08a; display:none; margin:0;"></p>
        <p id="signup-success" class="muted" style="color:var(--gold); display:none; margin:0;"></p>
      </form>
    </div>

    <p class="muted" style="margin-top:16px;">
      Already have an account? <a href="login.html" style="color:var(--gold-bright);">Log in</a>
    </p>
    <p class="muted" style="margin-top:8px;"><a href="../index.html" style="color:var(--gold);">← Back to site</a></p>
  </div>
</section>

<script src="../js/config.js"></script>
<script src="../js/sample-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/data.js"></script>
<script>
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('signup-error');
    const successEl = document.getElementById('signup-success');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!BCMData.isLive()){
      errorEl.textContent = "Supabase isn't connected yet — see README.md.";
      errorEl.style.display = 'block';
      return;
    }

    try{
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { session } = await BCMData.signUp(email, password, name);

      if (session){
        await BCMData.ensureMemberRow(session);
        location.href = 'pending.html';
      } else {
        successEl.textContent = 'Check your email to confirm your account, then log in below.';
        successEl.style.display = 'block';
        e.target.reset();
      }
    }catch(err){
      errorEl.textContent = err.message || 'Something went wrong.';
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
