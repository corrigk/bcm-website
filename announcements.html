<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements — Boiler Catholic Men</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

<header id="site-header"></header>

<section class="section--tight" style="background:var(--blueprint); color:var(--parchment);">
  <div class="container">
    <div class="eyebrow" style="color:var(--gold-bright);">SEC. 02 — ANNOUNCEMENTS</div>
    <h1 style="color:#fff;">Announcements</h1>
    <p style="color:var(--gold); max-width:56ch;">
      Last-minute changes are pinned to the top. Everything else is sorted newest first.
    </p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="pinned-wrap" style="margin-bottom: 36px;"></div>

    <div class="eyebrow">ALL ANNOUNCEMENTS</div>
    <div id="announcements-list" style="margin-top:14px;">
      <p class="muted">Loading…</p>
    </div>
  </div>
</section>

<style>
  .ann-group{ margin-bottom: 22px; }
  .ann-group summary{
    cursor:pointer; list-style:none; user-select:none;
    font-family: var(--f-mono); font-size:0.78rem; letter-spacing:0.08em;
    text-transform:uppercase; color: var(--blueprint);
    padding: 12px 14px; border: 1px solid var(--paper-line); background: var(--parchment);
    display:flex; align-items:center; justify-content:space-between;
  }
  .ann-group summary::-webkit-details-marker{ display:none; }
  .ann-group summary::after{ content:"+"; font-size:1rem; }
  .ann-group[open] summary::after{ content:"−"; }
  .ann-group .ann-group-body{ padding-top:14px; display:flex; flex-direction:column; gap:14px; }
</style>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/sample-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  function announcementCard(a, pinnedStyle){
    const location = a.location ? `<p class="muted" style="margin:-4px 0 8px;">📍 ${bcmEscape(a.location)}</p>` : '';
    const images = (a.image_urls && a.image_urls.length)
      ? `<div class="ann-images">${a.image_urls.map(u => `<img src="${u}" alt="">`).join('')}</div>`
      : '';
    return `
      <div class="panel${pinnedStyle ? '' : ''}" style="${pinnedStyle ? 'border-color:var(--urgent);' : ''}">
        <div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          ${a.pinned ? '<span class="tag" style="color:var(--urgent); border-color:var(--urgent);">Last-Minute</span>' : '<span></span>'}
          <span class="tag">${bcmFormatDateTime(a.created_at)}</span>
        </div>
        <h3>${bcmEscape(a.title)}</h3>
        ${location}
        <p style="white-space:pre-line;">${bcmEscape(a.body)}</p>
        ${images}
      </div>
    `;
  }

  // Buckets announcements older than 7 days by calendar month, e.g.
  // "August 2026" — most recent month first. Everything within the
  // last 7 days is returned separately as "recent" and shown open.
  function groupOlderAnnouncements(items){
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7 * 86400000);
    const recent = items.filter(a => new Date(a.created_at) >= weekAgo);
    const older = items.filter(a => new Date(a.created_at) < weekAgo);

    const order = [];
    const groups = {};
    older.forEach(a => {
      const d = new Date(a.created_at);
      const key = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      if (!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(a);
    });
    return { recent, order, groups };
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const pinnedWrap = document.getElementById('pinned-wrap');
    const list = document.getElementById('announcements-list');
    try{
      const all = await BCMData.getAnnouncements();
      const now = new Date();
      const notExpired = a => !a.expires_at || new Date(a.expires_at) > now;

      const pinned = all.filter(a => a.pinned && notExpired(a));
      const rest = all.filter(a => !a.pinned || !notExpired(a));

      pinnedWrap.innerHTML = pinned.length
        ? `<div class="eyebrow">LAST-MINUTE</div>` + pinned.map(a => announcementCard(a, true)).join('')
        : '';

      if (!rest.length){
        list.innerHTML = '<p class="muted">Nothing here yet.</p>';
        return;
      }

      const { recent, order, groups } = groupOlderAnnouncements(rest);

      let html = '';
      html += recent.length
        ? `<div class="stack" style="margin-bottom: ${order.length ? '28px' : '0'};">${recent.map(a => announcementCard(a, false)).join('')}</div>`
        : '';
      order.forEach(key => {
        html += `
          <details class="ann-group">
            <summary>${key} (${groups[key].length})</summary>
            <div class="ann-group-body">${groups[key].map(a => announcementCard(a, false)).join('')}</div>
          </details>
        `;
      });
      list.innerHTML = html || '<p class="muted">Nothing here yet.</p>';
    }catch(e){
      console.error(e);
      list.innerHTML = '<p class="muted">Couldn\'t load announcements right now.</p>';
    }
  });
</script>
</body>
</html>
